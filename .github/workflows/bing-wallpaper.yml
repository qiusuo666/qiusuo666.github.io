name: Daily Bing Wallpaper

# 每天把 Bing 每日壁纸的元数据抓成 data/bing.json 并提交回仓库：
#   1. 页面只需 fetch 同源 JSON，彻底绕开浏览器 CORS（Bing API 不返回 CORS 头）
#   2. 每天的提交本身就是仓库活动，scheduled workflow 的 60 天停用计时器被持续重置
# 抓取失败时不覆盖旧文件，页面继续显示上一张，不会退回内置壁纸。

on:
  schedule:
    # GitHub 的定时任务在高峰期会被延迟甚至整次丢弃（实测 2026-11-08 00:10 那次就没跑）。
    # 所以不指望单次命中，改成每 2 小时一次，一天 12 次，丢几次也能在 2 小时内补上。
    - cron: '5 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write   # 提交 data/bing.json
  actions: write    # 提交后显式触发 pages.yml（GITHUB_TOKEN 的 push 不会自动触发它）

concurrency:
  group: bing-wallpaper
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Bing wallpaper metadata
        run: |
          set -euo pipefail
          mkdir -p data
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          curl -fsSL --max-time 20 --retry 3 --retry-delay 3 -A "$UA" \
            'https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1&mkt=zh-CN' \
            -o /tmp/bing_raw.json
          # 首页 HTML 里内嵌了图片故事 JSON（标题 / 正文 / 速览），API 本身不返回这些
          curl -fsSL --max-time 25 --retry 2 -A "$UA" -H 'Accept-Language: zh-CN,zh;q=0.9' \
            'https://cn.bing.com/?mkt=zh-CN' -o /tmp/bing_home.html || echo "首页抓取失败，跳过富文本"
          python3 - <<'PY'
          import json, re, os, html as htmllib, urllib.request

          raw = json.load(open('/tmp/bing_raw.json', encoding='utf-8'))
          if not raw.get('images'):
              raise SystemExit('Bing 返回里没有 images 字段')

          img = raw['images'][0]
          base = 'https://www.bing.com' + img['url']
          uhd = re.sub(r'_\d+x\d+', '_UHD', base)

          def reachable(url):
              try:
                  req = urllib.request.Request(url, method='HEAD', headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      return r.status == 200
              except Exception:
                  return False

          # 不是每张图都有 UHD 版本，拿不到就退回原始分辨率
          if not reachable(uhd):
              print('UHD 不可用，退回原图:', base)
              uhd = base

          # ---- 第 2 级：官方首页内嵌的图片故事（标题 / 地点 / 版权 / 第一段 / 速览）----
          # 用括号计数提取，不依赖固定前后文——cn.bing.com 在海外出口偶尔会返回结构不同的页面
          def extract_array(text, key):
              i = text.find('"' + key + '":')
              if i < 0:
                  return None
              j = text.find('[', i)
              if j < 0:
                  return None
              depth, in_str, esc = 0, False, False
              for k in range(j, len(text)):
                  c = text[k]
                  if in_str:
                      if esc:
                          esc = False
                      elif c == '\\':
                          esc = True
                      elif c == '"':
                          in_str = False
                      continue
                  if c == '"':
                      in_str = True
                  elif c == '[':
                      depth += 1
                  elif c == ']':
                      depth -= 1
                      if depth == 0:
                          return text[j:k + 1]
              return None

          headline = title = credit = description = quickfact = ''
          try:
              page = open('/tmp/bing_home.html', encoding='utf-8', errors='ignore').read()
              arr = extract_array(page, 'MediaContents')
              if arr:
                  ic = json.loads(arr)[0]['ImageContent']
                  headline = (ic.get('Headline') or '').strip()
                  title = (ic.get('Title') or '').strip()
                  credit = (ic.get('Copyright') or '').strip()
                  description = (ic.get('Description') or '').strip()
                  quickfact = ((ic.get('QuickFact') or {}).get('MainText') or '').strip()
                  print('官方首页: 标题=%s 正文字数=%d' % (headline or '-', len(description)))
              else:
                  print('官方首页里没有 MediaContents，改由图文详情提供标题/地点/版权')
          except Exception as e:
              print('官方首页解析失败（不影响壁纸本体）:', e)

          # ---- 第 3 级：完整的三段图文说明 ----
          # Bing 官方接口只给第一段，后两段只出现在壁纸站详情页里。
          # 这个页面的 title 行同时含 标题|地点 (© 版权) - 日期，所以它也能兜住第 2 级。
          story, date_str = [], ''
          try:
              day_url = 'https://bing.ee123.net/detail/' + img.get('enddate', img.get('startdate', ''))
              req = urllib.request.Request(day_url, headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36'})
              src = urllib.request.urlopen(req, timeout=15).read().decode('utf-8', 'ignore')
              m = re.search(r'<p class="title">(.*?)</p>\s*<span class="sub">(.*?)</span>', src, re.S)
              if m:
                  line = htmllib.unescape(re.sub(r'<[^>]+>', '', m.group(1))).replace('\xa0', ' ').strip()
                  # 归来的草原巨兽 | 草原上的一头野牛，… (© Tandem Stock/Adobe Stock) - 2026/11/07
                  head_part, sep, rest = line.partition('|')
                  if sep:
                      headline = headline or head_part.strip()
                  else:
                      rest = line
                  dm = re.search(r'-\s*(\d{4}/\d{1,2}/\d{1,2})\s*$', rest)
                  if dm:
                      date_str = dm.group(1)
                      rest = rest[:dm.start()].strip()
                  cm = re.search(r'[（(](©[^)）]*)[)）]', rest)
                  if cm:
                      credit = credit or cm.group(1).strip()
                      rest = rest[:cm.start()].strip()
                  title = title or rest.strip()

                  paras = re.findall(r'<p>(.*?)</p>', m.group(2), re.S)
                  story = [htmllib.unescape(re.sub(r'<[^>]+>', '', p)).strip() for p in paras]
                  story = [p for p in story if p]
                  print('图文详情: %d 段 | 日期=%s | 标题=%s' % (len(story), date_str or '-', headline or '-'))
              else:
                  print('详情页结构变化，只保留 API 层数据')
          except Exception as e:
              print('完整文案获取失败（不影响壁纸本体）:', e)

          # 官方首页没给标题时，用 API 的 title 字段兜底（同样是"归来的草原巨兽"这种）
          if not headline:
              headline = (img.get('title') or '').strip()
          # 正文：官方只给第一段，没有就用图文详情的第一段
          if not description and story:
              description = story[0]

          # ---- 防退化：同一张图沿用上一轮抓到的富文本，别把已有信息写成空 ----
          # 之前 2026-11-07 那次因为官方首页解析失败，把 title/credit/description 全清空了。
          prev = {}
          try:
              prev = json.load(open('data/bing.json', encoding='utf-8'))
          except Exception:
              pass
          same_day = prev.get('day') and prev.get('day') == img.get('startdate', '')
          if same_day:
              headline = headline or prev.get('headline', '')
              title = title or prev.get('title', '')
              credit = credit or prev.get('credit', '')
              description = description or prev.get('description', '')
              quickfact = quickfact or prev.get('quickfact', '')
              if not story:
                  story = prev.get('story') or []
              if not date_str:
                  date_str = prev.get('date', '')
              print('同一天重跑：缺失字段已用上一轮的值补齐')

          # 刻意不放时间戳：只有壁纸真的换了，文件才会变，才不会天天产生无意义提交
          out = {
              'day': img.get('startdate', ''),
              'date': date_str or (img.get('enddate') or ''),
              'url': uhd,
              'url_sd': base,
              'copyright': img.get('copyright', ''),
              'copyrightlink': img.get('copyrightlink', ''),
              'headline': headline,
              'title': title,
              'credit': credit,
              'description': description,
              'quickfact': quickfact,
              'story': story,
          }
          with open('data/bing.json', 'w', encoding='utf-8') as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print('壁纸日期:', out['day'])
          print('图片地址:', out['url'])
          print('简介: 标题=%s | 地点=%s | 正文 %d 段' % (out['headline'] or '-', (out['title'] or '-')[:20], len(out['story'])))
          PY

      - name: Commit if changed
        id: commit
        run: |
          set -euo pipefail
          git add data/bing.json
          if git diff --cached --quiet; then
            echo "壁纸没有变化，跳过提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(wallpaper): $(date -u +%F) Bing 每日壁纸更新"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Pages deployment
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
